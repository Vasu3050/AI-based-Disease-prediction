<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MediPredict AI — educational blood-test analysis and disease-risk estimation prototype. Not a medical device."
    />
    <meta name="theme-color" content="#0ba99b" />
    <title>MediPredict AI</title>
    <script>
      // Apply stored theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var theme = localStorage.getItem('mp-theme') || 'system';
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
